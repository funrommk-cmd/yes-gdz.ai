<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yes-gdz.ai | Авторизація</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>yes-gdz<span class="accent-text">.ai</span></h1>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 24px; font-size: 0.95rem;">Твій персональний ГДЗ-репетитор з ІІ</p>
        
        <button onclick="loginWithGoogle()" class="btn-secondary">
            <svg width="18" height="18" viewBox="0 0 24 24" style="vertical-align: middle; margin-right: 8px;">
                <path fill="#EA4335" d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.2-5.136 4.2A5.6 5.6 0 0 1 8.35 13a5.6 5.6 0 0 1 5.64-5.6c2.4 0 4.417 1.5 5.228 3.65l3.904-3.03A11.23 11.23 0 0 0 14 2C7.925 2 3 6.925 3 13s4.925 11 11 11c5.73 0 10.536-4.114 11-9.61H12.24Z"/>
            </svg>
            Увійти через Google
        </button>

        <div class="divider">або через пошту</div>

        <div id="emailForm">
            <div class="input-group">
                <label for="email">Електронна пошта</label>
                <input type="email" id="email" placeholder="name@school.com">
            </div>
            <div class="input-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button onclick="loginWithEmail()">✨ Увійти</button>
            <button onclick="registerWithEmail()" class="btn-secondary">Створити акаунт</button>
        </div>

        <div class="divider">або за номером</div>

        <div id="phoneForm">
            <div class="input-group">
                <label for="phone">Номер телефону</label>
                <input type="tel" id="phone" value="+380" placeholder="+380XXXXXXXXX">
            </div>
            <button onclick="sendSmsCode()" class="btn-secondary" style="border-color: var(--accent); color: var(--accent);">Надіслати код у SMS</button>
            
            <div id="otpBlock" style="display:none; margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--border);">
                <div class="input-group">
                    <label for="otpCode">6-значний код підтвердження</label>
                    <input type="text" id="otpCode" placeholder="123456" maxlength="6" style="text-align: center; letter-spacing: 4px; font-weight: bold;">
                </div>
                <button onclick="verifySmsCode()">Підтвердити та увійти</button>
            </div>
        </div>
    </div>

    <script type="module" src="auth.js"></script>
</body>
</html>
